# App + its own Postgres, as every project on the home server.
# The server scripts rely on: this file's name (docker-compose.yml), the "db"
# service, and POSTGRES_USER / POSTGRES_DB in .env (backups, restore).
services:
  app:
    build: .
    container_name: monolit-api
    env_file:
      - .env
    environment:
      # Inside compose the database is the "db" service, whatever .env says
      # for running outside Docker.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # 8011 on the host (the tunnel maps monolit.piatek-magazyn.com to it).
      - "8011:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17
    container_name: monolit-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
