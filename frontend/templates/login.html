{% extends "base.html" %}

{% block title %}Logowanie — MONOLIT{% endblock %}

{% block body %}
<div class="login-wrap">
    <form class="login-card" id="login-form" autocomplete="on">
        <div class="brand"><b>MONOLIT</b><span>Śledzenie nośników</span></div>
        <div class="fld">
            <label for="username">Login</label>
            <input id="username" autocomplete="username" required autofocus>
        </div>
        <div class="fld">
            <label for="password">Hasło</label>
            <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="pri" type="submit">Zaloguj</button>
        <div class="msg error" id="login-msg"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}<script src="/static/js/login.js?v={{ asset_version }}"></script>{% endblock %}
