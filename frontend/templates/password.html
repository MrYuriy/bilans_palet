{% extends "base.html" %}

{% block title %}Zmiana hasła — Bilans Palet EUR{% endblock %}

{% block body %}
<div class="login-wrap">
    <form class="login-card" id="password-form">
        <div class="brand"><b>Zmiana hasła</b><span id="password-why">Ustaw nowe hasło.</span></div>
        <div class="fld">
            <label for="old-password">Obecne hasło</label>
            <input id="old-password" type="password" autocomplete="current-password" required>
        </div>
        <div class="fld">
            <label for="new-password">Nowe hasło</label>
            <input id="new-password" type="password" autocomplete="new-password" required>
        </div>
        <div class="fld">
            <label for="new-password2">Powtórz nowe hasło</label>
            <input id="new-password2" type="password" autocomplete="new-password" required>
        </div>
        <button class="pri" type="submit">Zapisz nowe hasło</button>
        <div class="row">
            <a href="/app/pulpit" id="password-back">Wróć</a>
            <span class="sp"></span>
            <a href="#" id="password-logout">Wyloguj</a>
        </div>
        <div class="msg error" id="password-msg"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}<script src="/static/js/password.js?v={{ asset_version }}"></script>{% endblock %}
